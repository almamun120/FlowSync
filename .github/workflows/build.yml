name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rclone_version:
        description: "rclone version to bundle (e.g. v1.68.2, or latest)"
        default: "latest"
  schedule:
    - cron: "0 3 * * 1"   # weekly: picks up new rclone releases automatically

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works even if the project sits in a sub-folder of the repository
      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest image already ships the Android SDK. android-actions/setup-android@v3
      # failed here ("Failed to find package 'tools'"), so we use the preinstalled SDK directly.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Which rclone to bundle: workflow input, else repository variable RCLONE_VERSION, else the latest release
      - name: Resolve rclone version
        id: rv
        env:
          INPUT_V: ${{ github.event.inputs.rclone_version }}
          VAR_V: ${{ vars.RCLONE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${INPUT_V:-${VAR_V:-latest}}"
          if [ "$v" = "latest" ]; then
            v=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/rclone/rclone/releases/latest | jq -r .tag_name || true)
            [ -n "$v" ] && [ "$v" != "null" ] || v="v1.68.2"
          fi
          echo "Bundling rclone $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # rclone is compiled for Android once and cached by version + script hash
      - name: Cache rclone binary
        id: rclone-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.loc.outputs.dir }}/app/src/main/jniLibs
          key: rclone-${{ steps.rv.outputs.version }}-${{ hashFiles('**/scripts/build-rclone.sh') }}

      - name: Build rclone for Android
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" "ndk;27.2.12479018"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          RCLONE_VERSION=${{ steps.rv.outputs.version }} RCLONE_ABIS="arm64-v8a" bash scripts/build-rclone.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Permanent signing key from repository secrets (optional – falls back to the debug key)
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "No KEYSTORE_BASE64 secret – using debug key"
          fi

      - name: Build debug + release APK
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlowSync-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/**/*.apk

      # Every push to the default branch also publishes the APK as a GitHub Release
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlowSync build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/**/*.apk
