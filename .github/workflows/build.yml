name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest image already ships the Android SDK. android-actions/setup-android@v3
      # failed here ("Failed to find package 'tools'"), so we use the preinstalled SDK directly.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Works even if the project sits in a sub-folder of the repository
      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      # Permanent signing key from repository secrets (optional – falls back to the debug key)
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "No KEYSTORE_BASE64 secret – using debug key"
          fi

      - name: Build debug + release APK
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlowSync-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/**/*.apk

      # Every push to the default branch also publishes the APK as a GitHub Release
      - name: Publish release
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlowSync build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/**/*.apk
